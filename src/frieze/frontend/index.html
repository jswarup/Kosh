<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fenst</title>
    <meta name="description" content="Fenst — a lightweight file explorer and viewer built with Tauri">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Toolbar -->
        <header id="toolbar" class="toolbar">
            <div class="toolbar-group">
                <button id="btn-open-folder" class="toolbar-btn" title="Open Folder (Ctrl+O)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>Open Folder</span>
                </button>
                <button id="btn-refresh" class="toolbar-btn" title="Refresh Explorer">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"/>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                    </svg>
                </button>
            </div>
            <div class="toolbar-group toolbar-right">
                <button id="btn-toggle-reuse-window" class="toolbar-btn active" title="Toggle Window Reuse (Alt+R)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="14" height="12" rx="2"/>
                        <path d="M8 21h12a2 2 0 0 0 2-2V9"/>
                    </svg>
                </button>
                <button id="btn-toggle-theme" class="toolbar-btn" title="Toggle Theme (Ctrl+T)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>
                <button id="btn-toggle-word-wrap" class="toolbar-btn" title="Toggle Word Wrap (Alt+Z)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18M3 12h15a3 3 0 0 1 0 6h-4"/>
                        <polyline points="17 16 14 18 17 20"/>
                    </svg>
                </button>
                <button id="btn-toggle-explorer" class="toolbar-btn active" title="Toggle Explorer (Ctrl+B)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <div id="workspace">
            <!-- Explorer Side Panel -->
            <aside id="explorer" class="explorer">
                <div class="explorer-header">
                    <h2 class="explorer-title">EXPLORER</h2>
                </div>
                <div id="explorer-tree" class="explorer-tree">
                    <div class="explorer-empty">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                        <p>No folder opened</p>
                        <button id="btn-open-folder-empty" class="btn-open-empty">Open Folder</button>
                    </div>
                </div>
            </aside>

            <!-- Resize Handle -->
            <div id="resize-handle" class="resize-handle"></div>

            <!-- Content Frame -->
            <main id="content" class="content">
                <div id="content-welcome" class="content-welcome">
                    <div class="welcome-logo">
                        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.15">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                        </svg>
                    </div>
                    <h1 class="welcome-title">Fenst</h1>
                    <p class="welcome-subtitle">Lightweight File Explorer & Viewer</p>
                    <div class="welcome-shortcuts">
                        <div class="shortcut-item">
                            <kbd>Ctrl+O</kbd>
                            <span>Open Folder</span>
                        </div>
                        <div class="shortcut-item">
                            <kbd>Ctrl+B</kbd>
                            <span>Toggle Explorer</span>
                        </div>
                    </div>
                </div>
                <div id="content-viewer" class="content-viewer" style="display: none;">
                    <div id="content-tab-bar" class="tab-bar"></div>
                    <div id="file-content" class="file-content"></div>
                </div>
            </main>
        </div>

        <!-- Status Bar -->
        <footer id="statusbar" class="statusbar">
            <div class="statusbar-left">
                <span id="status-branch" class="status-item">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="6" y1="3" x2="6" y2="15"/>
                        <circle cx="18" cy="6" r="3"/>
                        <circle cx="6" cy="18" r="3"/>
                        <path d="M18 9a9 9 0 0 1-9 9"/>
                    </svg>
                    <span>main</span>
                </span>
                <span id="status-file-path" class="status-item status-filepath"></span>
            </div>
            <div class="statusbar-right">
                <span id="status-lines" class="status-item"></span>
                <span id="status-size" class="status-item"></span>
                <span id="status-encoding" class="status-item">UTF-8</span>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
