[package]
name = "fenst-app"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "fenst"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
kosh = { path = "../.." }
