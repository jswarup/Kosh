[package]
name = "kosh"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["src/gcomp", "src/fenst-app"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2.1"
paste = "1.0" 
serde = { version = "1", features = ["derive"] }
wgpu = { version = "29", features = ["spirv"] }
pollster = "0.4"

[dev-dependencies]
rand = "0.10.1"
spirv-builder = { git = "https://github.com/Rust-GPU/rust-gpu.git" }

[profile.dev.build-override]
opt-level = 3

[profile.dev.package.rustc_codegen_spirv]
opt-level = 3

