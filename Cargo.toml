[package]
name = "kosh"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["compute-shader"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2.1"
paste = "1.0" 

[dev-dependencies]
rand = "0.10.1"
wgpu = { version = "29", features = ["spirv"] }
pollster = "0.4"
spirv-builder = { git = "https://github.com/Rust-GPU/rust-gpu.git" }
