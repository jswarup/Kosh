[package]
name = "kosh"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["src/symph", "src/pykosh"]
default-members = [".", "src/symph", "src/pykosh"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2.1"
paste = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "30", features = ["spirv"] }
pollster = "0.4"
rfd = "0.15"
symph = { path = "src/symph" }
wxdragon = { version = "*", features = ["aui"] }
image = "0.25.10"

[build-dependencies]
spirv-builder = { git = "https://github.com/Rust-GPU/rust-gpu.git" }

[dev-dependencies]
rand = "0.10.1"

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 1
lto = "off"
codegen-units = 256
debug = false

[profile.release.build-override]
opt-level = 1
debug = false
